<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admissions | Gyan Niketan English Secondary School</title>
<meta name="description" content="Admissions open for Nursery to Class 10. Apply online — Gyan Niketan English Secondary School, Badan Nagar, Parsa-32.">
<meta name="keywords" content="admissions, English boarding school Parsa, Gyan Niketan admission, school admission Nepal">
<meta name="theme-color" content="#0A2342">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="admissions">
<script src="js/icons.js"></script>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="site-header"><div id="header-mount"></div></header>
<div class="nav-backdrop" id="nav-backdrop" hidden></div>

<main id="main">

  <!-- PAGE HERO -->
  <section class="page-hero">
    <div class="container page-hero-inner">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="page.home">Home</a><span>/</span>
        <span data-i18n="admis.hero.tag">Admissions</span>
      </nav>
      <span class="eyebrow" data-i18n="admis.hero.tag"></span>
      <h1 data-i18n="admis.hero.title"></h1>
      <p data-i18n="admis.hero.sub"></p>
    </div>
  </section>

  <!-- HOW TO APPLY — 4 STEPS -->
  <section class="section">
    <div class="container">
      <div class="section-head section-head-center">
        <span class="eyebrow" data-i18n="admis.steps.tag"></span>
        <h2 data-i18n="admis.steps.title"></h2>
      </div>
      <div class="card-grid card-grid-2">
        <article class="step-card reveal">
          <span class="step-num">1</span>
          <h3 data-i18n="admis.steps.s1.t"></h3>
          <p data-i18n="admis.steps.s1.d"></p>
        </article>
        <article class="step-card reveal">
          <span class="step-num">2</span>
          <h3 data-i18n="admis.steps.s2.t"></h3>
          <p data-i18n="admis.steps.s2.d"></p>
        </article>
        <article class="step-card reveal">
          <span class="step-num">3</span>
          <h3 data-i18n="admis.steps.s3.t"></h3>
          <p data-i18n="admis.steps.s3.d"></p>
        </article>
        <article class="step-card reveal">
          <span class="step-num">4</span>
          <h3 data-i18n="admis.steps.s4.t"></h3>
          <p data-i18n="admis.steps.s4.d"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- CRITERIA TABLE -->
  <section class="section section-alt">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow" data-i18n="admis.criteria.tag"></span>
          <h2 data-i18n="admis.criteria.title"></h2>
        </div>
      </div>
      <p class="section-sub" style="max-width:720px; margin-bottom:1.6rem;" data-i18n="admis.criteria.p"></p>
      <div style="overflow-x:auto;">
        <table class="info-table">
          <thead>
            <tr>
              <th data-i18n="admis.criteria.th1">Grade</th>
              <th data-i18n="admis.criteria.th2">Minimum Age</th>
              <th data-i18n="admis.criteria.th3">Required Documents</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td data-i18n="admis.criteria.r1.g"></td>
              <td data-i18n="admis.criteria.r1.a"></td>
              <td data-i18n="admis.criteria.r1.d"></td>
            </tr>
            <tr>
              <td data-i18n="admis.criteria.r2.g"></td>
              <td data-i18n="admis.criteria.r2.a"></td>
              <td data-i18n="admis.criteria.r2.d"></td>
            </tr>
            <tr>
              <td data-i18n="admis.criteria.r3.g"></td>
              <td data-i18n="admis.criteria.r3.a"></td>
              <td data-i18n="admis.criteria.r3.d"></td>
            </tr>
            <tr>
              <td data-i18n="admis.criteria.r4.g"></td>
              <td data-i18n="admis.criteria.r4.a"></td>
              <td data-i18n="admis.criteria.r4.d"></td>
            </tr>
            <tr>
              <td data-i18n="admis.criteria.r5.g"></td>
              <td data-i18n="admis.criteria.r5.a"></td>
              <td data-i18n="admis.criteria.r5.d"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- APPLICATION FORM + FEES -->
  <section class="section">
    <div class="container layout-2col">
      <div>
        <span class="eyebrow" data-i18n="admis.form.tag"></span>
        <h2 data-i18n="admis.form.title"></h2>
        <p data-i18n="admis.form.sub"></p>

        <form class="form-card" data-form="admission" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="adm-name" data-i18n="admis.form.name"></label>
              <input id="adm-name" name="name" type="text" required>
            </div>
            <div class="field">
              <label for="adm-phone" data-i18n="admis.form.phone"></label>
              <input id="adm-phone" name="phone" type="tel" required>
            </div>
            <div class="field">
              <label for="adm-email" data-i18n="admis.form.email"></label>
              <input id="adm-email" name="email" type="email">
            </div>
            <div class="field">
              <label for="adm-grade" data-i18n="admis.form.grade"></label>
              <select id="adm-grade" name="grade" required>
                <option value="" data-i18n="admis.form.grade.select"></option>
                <option>Nursery</option>
                <option>LKG</option>
                <option>UKG</option>
                <option>Class 1</option>
                <option>Class 2</option>
                <option>Class 3</option>
                <option>Class 4</option>
                <option>Class 5</option>
                <option>Class 6</option>
                <option>Class 7</option>
                <option>Class 8</option>
                <option>Class 9</option>
                <option>Class 10</option>
              </select>
            </div>
            <div class="field span-2">
              <label for="adm-student" data-i18n="admis.form.student"></label>
              <input id="adm-student" name="student" type="text" required>
            </div>
            <div class="field span-2">
              <label for="adm-msg" data-i18n="admis.form.message"></label>
              <textarea id="adm-msg" name="message" rows="4"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-gold" style="margin-top:20px;" data-i18n="admis.form.submit"></button>
          <p class="form-success" hidden></p>
        </form>
      </div>

      <aside>
        <span class="eyebrow" data-i18n="admis.fees.tag"></span>
        <h2 data-i18n="admis.fees.title"></h2>
        <p data-i18n="admis.fees.p"></p>
        <ul class="prose" style="padding-left:1.2rem;">
          <li data-i18n="admis.fees.li1"></li>
          <li data-i18n="admis.fees.li2"></li>
          <li data-i18n="admis.fees.li3"></li>
          <li data-i18n="admis.fees.li4"></li>
        </ul>
      </aside>
    </div>
  </section>

</main>

<footer class="site-footer"><div id="footer-mount"></div></footer>
<button class="to-top" id="to-top" type="button" aria-label="Back to top">↑</button>

<script src="js/layout.js"></script>
<script src="js/notices-data.js"></script>
<script src="js/gallery-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
