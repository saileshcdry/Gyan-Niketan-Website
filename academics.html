<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academics | Gyan Niketan English Secondary School</title>
<meta name="description" content="NEB-aligned English-medium curriculum from Nursery to Class 10, with science labs, computer labs and extracurricular clubs.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">

<body data-page="academics">

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="site-header"><div id="header-mount"></div></header>
<div class="nav-backdrop" id="nav-backdrop" hidden></div>

<main id="main">

  <section class="page-hero">
    <div class="container page-hero-inner">
      <nav class="breadcrumbs"><a href="index.html" data-i18n="page.home">Home</a><span>/</span><span data-i18n="acad.hero.tag">Academics</span></nav>
      <span class="eyebrow" data-i18n="acad.hero.tag"></span>
      <h1 data-i18n="acad.hero.title"></h1>
      <p data-i18n="acad.hero.sub"></p>
    </div>
  </section>

  <!-- Grades -->
  <section class="section">
    <div class="container">
      <div class="section-head section-head-center">
        <span class="eyebrow" data-i18n="acad.grades.tag"></span>
        <h2 data-i18n="acad.grades.title"></h2>
        <p class="section-sub" data-i18n="acad.grades.sub"></p>
      </div>
      <div class="card-grid card-grid-2">
        <article class="value-card reveal"><svg class="ic"><use href="#i-users"/></svg><h3 data-i18n="acad.grades.g1.t"></h3><p data-i18n="acad.grades.g1.d"></p></article>
        <article class="value-card reveal"><svg class="ic"><use href="#i-book"/></svg><h3 data-i18n="acad.grades.g2.t"></h3><p data-i18n="acad.grades.g2.d"></p></article>
        <article class="value-card reveal"><svg class="ic"><use href="#i-flask"/></svg><h3 data-i18n="acad.grades.g3.t"></h3><p data-i18n="acad.grades.g3.d"></p></article>
        <article class="value-card reveal"><svg class="ic"><use href="#i-trophy"/></svg><h3 data-i18n="acad.grades.g4.t"></h3><p data-i18n="acad.grades.g4.d"></p></article>
      </div>
    </div>
  </section>

  <!-- Curriculum & Assessment -->
  <section class="section section-alt">
    <div class="container layout-2col">
      <div class="prose">
        <span class="eyebrow" data-i18n="acad.curriculum.tag"></span>
        <h2 data-i18n="acad.curriculum.title"></h2>
        <p data-i18n="acad.curriculum.p"></p>
        <ul>
          <li data-i18n="acad.curriculum.li1"></li>
          <li data-i18n="acad.curriculum.li2"></li>
          <li data-i18n="acad.curriculum.li3"></li>
          <li data-i18n="acad.curriculum.li4"></li>
          <li data-i18n="acad.curriculum.li5"></li>
        </ul>
      </div>
      <aside>
        <div class="photo-frame" style="aspect-ratio: 4/5;"><span class="photo-fallback">Classroom</span></div>
      </aside>
    </div>
  </section>

  <!-- Clubs -->
  <section class="section">
    <div class="container">
      <div class="section-head section-head-center">
        <span class="eyebrow" data-i18n="acad.clubs.tag"></span>
        <h2 data-i18n="acad.clubs.title"></h2>
      </div>
      <div class="card-grid card-grid-3">
        <article class="club-card reveal"><svg class="ic"><use href="#i-flask"/></svg><h3 data-i18n="acad.clubs.c1.t"></h3><p data-i18n="acad.clubs.c1.d"></p></article>
        <article class="club-card reveal"><svg class="ic"><use href="#i-trophy"/></svg><h3 data-i18n="acad.clubs.c2.t"></h3><p data-i18n="acad.clubs.c2.d"></p></article>
        <article class="club-card reveal"><svg class="ic"><use href="#i-users"/></svg><h3 data-i18n="acad.clubs.c3.t"></h3><p data-i18n="acad.clubs.c3.d"></p></article>

        <article class="club-card reveal"><svg class="ic"><use href="#i-shield"/></svg><h3 data-i18n="acad.clubs.c5.t"></h3><p data-i18n="acad.clubs.c5.d"></p></article>

  <section class="section">
    <div class="container">
      <div class="section-cta">
        <p data-i18n="band.title"></p>
        <a href="admissions.html" class="btn btn-gold" data-i18n="cta.apply"></a>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer"><div id="footer-mount"></div></footer>
<button class="to-top" id="to-top" type="button" aria-label="Back to top">↑</button>
